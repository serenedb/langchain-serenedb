name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal Python example (or steps) that reproduces the problem.
      render: python
      placeholder: |
        from langchain_serenedb import SereneDBEngine, SereneDBVectorStore

        engine = SereneDBEngine.from_connection_string(
            "host=127.0.0.1 port=7890 user=postgres dbname=postgres"
        )
        # ...
        # Observe: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: input
    id: package-version
    attributes:
      label: langchain-serenedb version
      placeholder: "e.g. 0.1.0 or commit hash"
    validations:
      required: false
  - type: input
    id: serenedb-version
    attributes:
      label: SereneDB version
      placeholder: "e.g. 26.07.3 or commit hash"
    validations:
      required: false
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "e.g. 3.12"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, tracebacks, OS/platform info, or anything else relevant.
    validations:
      required: false
