version: 2
updates:
  # Python dependencies declared in pyproject.toml (project + optional "test" extra).
  # Note: Dependabot updates the version constraints here; uv.lock must be refreshed
  # separately (`uv lock`) since it does not yet maintain uv lockfiles.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The actions pinned in .github/workflows (checkout, setup-python, setup-uv, ...).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
