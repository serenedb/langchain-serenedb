# Pre-commit hooks for formatting and sanitizing Python (and repo hygiene).
# See https://pre-commit.com.
#
# Run EXPLICITLY -- this is intentionally NOT installed as a git hook, so the formatter
# never rewrites a commit behind your back and you stay in control of what/when to
# format (use `# fmt: skip` / `# noqa` / pyproject per-file-ignores for exceptions).
#
#   pre-commit run --all-files          # developer: apply fixes across the tree
#
# CI validates without modifying anything (added to the PR workflow later), e.g.:
#   ruff check . && ruff format --check .
#
# Ruff is pinned to the version locked in uv.lock so this and a local `ruff format .` /
# `ruff check .` produce identical results. Bump both together (e.g. `pre-commit
# autoupdate` plus a matching `uv lock`).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml         # e.g. tests/docker-compose.yml, this file
      - id: check-toml         # e.g. pyproject.toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check         # lint + import sorting (E/F/I/T201, per pyproject)
        args: [--fix]
      - id: ruff-format        # formatter
